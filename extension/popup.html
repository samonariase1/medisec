<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #0284c7;
    }
    .status-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
    }
    button {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    #status-text {
      font-size: 13px;
      color: #475569;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h2>MediSec Security</h2>
  <div class="status-box">
    <div><span class="indicator"></span><strong>Session Protected</strong></div>
    <div id="status-text">Monitoring active EMR session</div>
  </div>
  <button id="verifyBtn">Run Security Handshake</button>

  <script src="popup.js"></script>
</body>
</html>
