services:
  - type: web
    name: medisec-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production

      - key: FLASK_DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: medisec-db
          property: connectionString

      - key: CORS_ORIGINS
        sync: false

      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: PERMANENT_SESSION_LIFETIME
        value: "1800"

databases:
  - name: medisec-db
    plan: free
